<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garoux Service</title>
    <style>
        /* Современный темный стиль */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: radial-gradient(circle at center, #1e1e2f 0%, #0f0f15 100%);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        .container {
            padding: 20px;
            max-width: 400px;
            width: 90%;
        }

        /* Красивый светящийся логотип-текст */
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            letter-spacing: 2px;
            background: linear-gradient(45deg, #00ffcc, #0077ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0px 0px 20px rgba(0, 255, 204, 0.2);
        }

        p {
            color: #aaa;
            font-size: 1rem;
            margin-bottom: 40px;
        }

        /* Эффектная кнопка для перехода */
        .btn {
            display: inline-block;
            text-decoration: none;
            padding: 15px 35px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(45deg, #0077ff, #00ffcc);
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(0, 119, 255, 0.4);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        /* Анимация при нажатии/наведении */
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 255, 204, 0.6);
        }

        .btn:active {
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>GAROUX SITE</h1>
        <p>Добро пожаловать! Нажмите на кнопку ниже, чтобы войти в личный кабинет сервиса.</p>
        
        <a href="https://garouxbiz.pagekite.me/" class="btn">Войти в сервис</a>
    </div>

</body>
</html>
